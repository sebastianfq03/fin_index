# ==============================================================================
# CONFIGURACIÓN MAESTRA: PROYECTO IVF & LOOK-ALIKE ENAHO 2025
# ==============================================================================

project:
  name: "Indice_Vulnerabilidad_Financiera_ENAHO_2025"
  title: "Construcción del Índice de Vulnerabilidad Financiera (IVF) y Modelo Look-Alike (ENAHO 2025)"
  country: "Perú"
  year: 2025
  seed: 42

paths:
  data_dir: "Datos"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  processed_dir: "reports/data"
  dashboard_html: "reports/dashboard_ivf_enaho2025.html"
  report_pdf: "reports/Informe_Investigacion_IVF_ENAHO2025.pdf"

files:
  mod_100: "Enaho01-2025-100.csv"
  mod_200: "Enaho01-2025-200.csv"
  mod_300: "Enaho01A-2025-300.csv"
  mod_400: "Enaho01A-2025-400.csv"
  mod_500: "Enaho01a-2025-500.csv"
  mod_602: "Enaho01-2025-602.csv"
  mod_700: "Enaho01-2025-700.csv"
  mod_700a: "Enaho01-2025-700A.csv"
  mod_601: "Enaho01-2025-601.csv"  # Nota: 1.28 GB, no cargar en RAM

data_specs:
  encoding: "latin1"
  delimiter: ";"
  id_hogar: ["CONGLOME", "VIVIENDA", "HOGAR"]
  id_persona: ["CONGLOME", "VIVIENDA", "HOGAR", "CODPERSO"]
  age_min: 18
  age_max: 65
  unbanked_code: 6 # P558E1_6 == 6
  weight_col: "FAC500A"

imputation:
  missing_threshold_univariate: 0.05
  mice_iterations: 5
  mice_random_state: 42

lca_model:
  k_grid: [2, 3, 4, 5, 6, 7]
  max_iter: 300
  n_init: 3
  abs_tol: 1e-5
  alpha_ivf: 0.70 # Peso asignado al perfil latente R_k vs score individual V_i
  min_mass_pct: 0.05 # Restricción de masa poblacional mínima expandida (5%)
  max_relative_entropy: 0.15 # Umbral de entropía relativa para nitidez de clasificación

lookalike_model:
  target_col: "IS_BANCARIZADO"
  test_size: 0.25
  calibration_method: "isotonic"
  n_estimators: 350
  learning_rate: 0.05
  max_depth: 6
  early_stopping_rounds: 30

bootstrap:
  n_replicates: 200
  cluster_col: "CONGLOME"
  confidence_level: 0.95

strategic_matrix:
  ivf_thresholds:
    low: 350
    high: 650
  propensity_thresholds:
    low: 0.35
    high: 0.65
